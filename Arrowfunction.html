<!DOCTYPE html>
<html>
    <head>
        <title>Arrow Function</title>
    </head>
    <body>
        <h1> Using arrow functions </h1>
        <p>using arrow function to multiply two numbers.</p>
        <p id="demo"></p>
        <script>
            const multiply=(a,b)=>a*b;
            document.getElementById("demo").innerHTML="The result is " + multiply(4,5);
        </script>
    </body>
</html>
