<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Object</title>
    </head>
    <body>
        <h1>JavaScript Object</h1>
        <p id="demo"></p>
        <script>
            const person ={
                firstname:"john",
                lastname:"doe",
                age:50,
                eyecolor:"blue"
            };
            document.getElementById("demo").innerHTML = person.firstname + " is   " + person.age + " years old.";
        </script>
    </body>
</html>
