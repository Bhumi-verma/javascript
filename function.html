<!DOCTYPE html>
<html>
    <body>
        <h1>JavaScript Functions</h1>
        <h2>The return statement</h2>
        <p>A Function That return the grettings: Hello World</p>
        <p id="demo"></p>
        <script>
            function sayhello(){
                return "Hello world";
            }
            let gretting = sayhello();
            document.getElementById("demo").innerHTML = gretting;
        </script>
    </body>
</html>
