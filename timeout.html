<!DOCTYPE html>
<html>
    <head>
        <title>Timeout function</title>
    </head>
    <body>
        <h1>Using setTimeout function</h1>
        <p>Using setTimeout function to execute code after a message for 3 seconds</p>
        <h2 id="demo"></h2>
        <script>
            setTimeout( function myFunction(){
                document.getElementById("demo").innerHTML = "Hello, World!";
            },3000);
           // function myFunction(){
               // document.getElementById("demo").innerHTML = "Hello, World!";
            //}
        </script>
    </body>
</html>
